name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Solo biblioteca estándar: no hay nada que instalar. Comprueba también que cada texto tenga su traducción.
      - run: python -m unittest -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
